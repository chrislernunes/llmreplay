[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmreplay"
version = "0.1.0"
description = "Deterministic replay debugger for LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
openai    = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
langchain = ["langchain>=0.2", "langchain-core>=0.2"]
s3        = ["boto3>=1.28"]
web       = ["streamlit>=1.35", "plotly>=5.0"]
dev       = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]
all       = ["llmreplay[openai,anthropic,langchain,s3,web,dev]"]

[project.scripts]
llmreplay = "llmreplay.cli:cli"

[tool.setuptools.packages.find]
where   = ["."]
include = ["llmreplay*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]